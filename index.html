<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickReceive · working prototype</title>
<meta name="description" content="QuickReceive receiving app prototype (fictional data) by Bhavna Sheth.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237A5A2B' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M8 8v8M11 8v8M14 8v8M17 8v8'/%3E%3C/svg%3E">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&amp;family=Barlow:wght@400;500;600;700&amp;family=Archivo:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#EFEBE4}
a{color:#7A5A2B}a:hover{color:#5C4320}
button,input{font-family:inherit}
h1{font-family:'Archivo','Barlow',sans-serif;font-weight:600 !important;letter-spacing:-0.2px}
h2{font-family:'Barlow Condensed','Barlow',sans-serif;letter-spacing:1.4px !important}
@keyframes qrpulse{0%,100%{opacity:1}50%{opacity:0.55}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>

</head><body>
<template id="tpl">

<div style="min-height: 100vh; box-sizing: border-box; padding: 24px; font-family: 'Barlow', system-ui, sans-serif; color: #1C1B19; background: #EFEBE4; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<main style="flex: 999 1 820px; min-width: 0; background: #FFFDF8; border: 1px solid #D8D1C4; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 36px; background: #FFFDF8; color: #1C1B19; border-bottom: 2px solid #A8834A">
<div style="display: flex; align-items: center; gap: 12px">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7A5A2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 8v8"></path><path d="M11 8v8"></path><path d="M15 8v8"></path><path d="M18 8v8"></path></svg>
<span style="font-family: 'Archivo', 'Barlow', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase"><span style="color: #1C1B19">Quick</span><span style="color: #7A5A2B">Receive</span></span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 26px; font-size: 15px; color: #5E5A52">
<span>Receiving dock 2 · Station B</span>
<span>Tech: J. Rivera</span>
<span>{{scannerStatus}}</span>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 16px; padding: 24px 36px; background: #F4F0E8; border-bottom: 1px solid #D8D1C4">
<label for="qr-scan" style="display: flex; align-items: center; gap: 8px; min-height: 48px; font-size: 16px; font-weight: 700">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg>
Ready to scan</label>
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; position: relative">
<div style="{{scanWrapStyle}}">
<input id="qr-scan" value="{{scanValue}}" onChange="{{onScanChange}}" onKeyDown="{{onScanKey}}" onFocus="{{onScanFocus}}" onBlur="{{onScanBlur}}" autoFocus="{{ true }}" autoComplete="off" placeholder="Click here, then scan (or type a code and press Enter)" style="{{scanInputStyle}}">
<sc-if value="{{hasScanValue}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{clearScan}}" aria-label="Clear" title="Clear" style="flex: 0 0 auto; min-width: 52px; border: none; border-left: 1px solid #D8D1C4; background: #F6EFE2; color: #5C4320; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
</sc-if>
<sc-if value="{{noScanValue}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{submitScan}}" aria-label="Submit code" title="Submit code" style="flex: 0 0 auto; min-width: 52px; border: none; border-left: 1px solid #D8D1C4; background: #F6EFE2; color: #5C4320; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10l-5 5 5 5"></path><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg></button>
</sc-if>
</div>
<span role="status" style="{{scanMsgStyle}}">{{scanMsg}}</span>
</div>
</div>

<sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
<div role="status" style="padding: 12px 24px; background: #F4EAD2; color: #6B430E; font-size: 16px; font-weight: 600; border-bottom: 1px solid #C9A25E">Offline · scans are saved on this laptop and will sync when Wi-Fi returns</div>
</sc-if>

<sc-if value="{{isBreak}}" hint-placeholder-val="{{ false }}">
<section style="padding: 72px 48px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; max-width: 720px">
<h1 style="margin: 0; font-size: 36px; font-weight: 700">On break</h1>
<p style="margin: 0; font-size: 19px; color: #45423C">J. Rivera signed out at 10:44. PO 4500-1234 is saved with 3 of 5 lines done, so nothing is lost.</p>
<p style="margin: 0; font-size: 17px; color: #5E5A52">This station stays locked until someone signs in.</p>
<button type="button" onClick="{{next}}" style="margin-top: 8px; min-height: 56px; padding: 0 28px; border-radius: 4px; border: 2px solid #7A5A2B; background: #7A5A2B; color: #FFFDF8; font-size: 18px; font-weight: 700; cursor: pointer">Sign back in</button>
</section>
</sc-if>

<sc-if value="{{isStart}}" hint-placeholder-val="{{ true }}">
<section style="padding: 64px 48px; display: flex; flex-direction: column; gap: 28px; max-width: 760px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 36px; font-weight: 700">Scan a packing slip or PO to start</h1>
<p style="margin: 0; font-size: 18px; color: #5E5A52">Or pick a delivery that's expected today.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600; color: #5E5A52; text-transform: uppercase; letter-spacing: 0.6px">Expected today</h2>
<button type="button" onClick="{{openDelivery}}" style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; text-align: left; padding: 18px 20px; border: 2px solid #7A5A2B; border-radius: 4px; background: #F6EFE2; color: #1C1B19; font-size: 18px; cursor: pointer; min-height: 64px">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700">PO 4500-1234 · Northstar Precision</span><span style="font-size: 15px; color: #5E5A52">{{deliverySub}}</span></span>
<span style="font-size: 15px; font-weight: 700; color: #7A5A2B">{{deliveryAction}}</span>
</button>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; padding: 18px 20px; border: 1px solid #D8D1C4; border-radius: 4px; font-size: 18px; min-height: 64px; box-sizing: border-box">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700">PO 4500-1240 · Harbor Composites</span><span style="font-size: 15px; color: #5E5A52">41 items on 8 lines · 3 COCs needed</span></span>
<span style="font-size: 15px; color: #5E5A52">Due 1:00 PM</span>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{isReceiving}}" hint-placeholder-val="{{ false }}">
<section style="display: flex; flex-direction: column">
<div style="padding: 28px 36px; border-bottom: 1px solid #E7E1D6; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px">
<button type="button" onClick="{{showDeliveries}}" style="margin-bottom: 12px; min-height: 32px; padding: 2px 0; border: none; background: none; color: #7A5A2B; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">← All deliveries</button>
<h1 style="margin: 0; font-size: 24px; font-weight: 700">PO 4500-1234 · Northstar Precision</h1>
</div>
<span style="font-size: 20px; font-weight: 700">{{progressText}}</span>
</div>
<div aria-hidden="true" style="height: 12px; border-radius: 6px; background: #E7E1D6; overflow: hidden"><div style="{{progressStyle}}"></div></div>
<span style="font-size: 15px; color: #5E5A52">{{itemsText}} · progress saves after every scan</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 40px; padding: 36px 36px 44px">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600; color: #5E5A52; text-transform: uppercase; letter-spacing: 0.6px">Lines</h2>
<sc-for list="{{lines}}" as="line" hint-placeholder-count="5">
<div style="{{line.rowStyle}}">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 17px; font-weight: 600">{{line.label}}</span><span style="font-size: 14px; color: #5E5A52">{{line.meta}}</span></span>
<span style="{{line.pillStyle}}">{{line.status}}</span>
</div>
</sc-for>
</div>
<div style="flex: 2 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<sc-if value="{{r.isChecking}}" hint-placeholder-val="{{ false }}">
<div role="status" style="border: 3px solid #7A5A2B; background: #F6EFE2; border-radius: 6px; padding: 36px 36px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 34px; font-weight: 700; color: #5C4320; animation: qrpulse 0.9s ease-in-out infinite">Checking…</span>
<span style="font-size: 20px; color: #5C4320">Against PO 4500-1234 in ERP</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600">{{r.checkLine}}</span>
<span style="font-size: 16px; color: #5E5A52">Result appears in under a second</span>
</div>
</sc-if>

<sc-if value="{{r.isIdle}}" hint-placeholder-val="{{ true }}">
<div style="border: 2px dashed #D8D1C4; border-radius: 6px; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5E5A52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M8 12h8"></path></svg>
<span style="font-size: 28px; font-weight: 700">Scan the next part</span>
<span style="font-size: 17px; color: #5E5A52">{{idleHint}}</span>
</div>
</sc-if>

<sc-if value="{{r.isMatch}}" hint-placeholder-val="{{ false }}">
<div role="status" style="border: 3px solid #2F6B3F; background: #E5EEE2; border-radius: 6px; padding: 36px 36px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 36px; font-weight: 700; color: #234F2F">✓ Matched</span>
<span style="font-size: 20px; color: #234F2F">{{r.sub}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600">{{r.value}}</span>
<span style="font-size: 16px; color: #5E5A52">{{r.detail}}</span>
</div>
<button type="button" onClick="{{openFlagPick}}" style="align-self: flex-start; min-height: 32px; padding: 2px 4px; border: none; background: none; color: #7A5A2B; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Something wrong with this part? Flag it</button>
<sc-if value="{{r.canUndo}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{undo}}" style="align-self: flex-start; min-height: 32px; padding: 2px 0; border: none; background: none; color: #7A5A2B; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">↶ {{r.undoText}}</button></sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-top: 9px; padding-top: 14px; border-top: 1px solid #E7E1D6"><button type="button" onClick="{{scanNext}}" style="min-height: 32px; padding: 2px 0; border: none; background: none; color: #7A5A2B; font-size: 16px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Scan next →</button><span style="font-size: 15px; color: #5E5A52">{{idleHint}}</span></div>
</sc-if>

<sc-if value="{{r.isFlagPick}}" hint-placeholder-val="{{ false }}">
<div style="border: 3px solid #9A6414; background: #F4EAD2; border-radius: 6px; padding: 28px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 30px; font-weight: 700; color: #6B430E">⚑ Flag this part</span>
<span style="font-size: 18px; color: #6B430E">{{r.pickValue}} · What's wrong?</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<button type="button" onClick="{{pickOther}}" style="min-height: 52px; text-align: left; padding: 0 18px; border-radius: 4px; border: 1px solid #A69E8F; background: #FFFDF8; color: #1C1B19; font-size: 17px; cursor: pointer">Not on this PO</button>
<button type="button" onClick="{{pickLabel}}" style="min-height: 52px; text-align: left; padding: 0 18px; border-radius: 4px; border: 1px solid #A69E8F; background: #FFFDF8; color: #1C1B19; font-size: 17px; cursor: pointer">Label doesn't match part</button>
<button type="button" onClick="{{pickOther}}" style="min-height: 52px; text-align: left; padding: 0 18px; border-radius: 4px; border: 1px solid #A69E8F; background: #FFFDF8; color: #1C1B19; font-size: 17px; cursor: pointer">Damaged</button>
</div>
<button type="button" onClick="{{cancelFlagPick}}" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 4px; border: 1px solid #A69E8F; background: #FFFDF8; color: #1C1B19; font-size: 16px; cursor: pointer">Cancel</button>
</sc-if>

<sc-if value="{{r.isMismatch}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="border: 3px solid #9B2C2C; background: #F5E1DD; border-radius: 6px; padding: 36px 36px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 36px; font-weight: 700; color: #6E1F1F">✕ {{r.title}}</span>
<span style="font-size: 20px; color: #6E1F1F">{{r.sub}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600">Scanned {{r.value}}</span>
<span style="font-size: 16px; color: #5E5A52">{{r.detail}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" onClick="{{fixClick}}" style="flex: 1 1 180px; min-height: 56px; border-radius: 4px; border: 2px solid #45423C; background: #FFFDF8; color: #1C1B19; font-size: 18px; font-weight: 600; cursor: pointer">Fix it · rescan or type</button>
<button type="button" onClick="{{flagClick}}" style="flex: 1 1 180px; min-height: 56px; border-radius: 4px; border: 2px solid #9A6414; background: #F4EAD2; color: #6B430E; font-size: 18px; font-weight: 700; cursor: pointer">⚑ Flag for lead</button>
</div>
</sc-if>

<sc-if value="{{r.isFixMode}}" hint-placeholder-val="{{ false }}">
<div style="border: 3px solid #45423C; background: #F4F0E8; border-radius: 6px; padding: 28px 28px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 30px; font-weight: 700">Fix it: scan the right label</span>
<span style="font-size: 18px; color: #45423C">{{r.fixHint}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 2px">
<button type="button" onClick="{{tryAgain}}" style="flex: 1 1 160px; min-height: 52px; border-radius: 4px; border: 2px solid #7A5A2B; background: #7A5A2B; color: #FFFDF8; font-size: 17px; font-weight: 700; cursor: pointer">Try again</button>
<button type="button" onClick="{{openManual}}" style="flex: 1 1 200px; min-height: 52px; border-radius: 4px; border: 2px solid #45423C; background: #FFFDF8; color: #1C1B19; font-size: 17px; font-weight: 600; cursor: pointer">Label won’t scan? Type it</button>
<sc-if value="{{r.canFlag}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{flagClick}}" style="flex: 1 1 200px; min-height: 52px; border-radius: 4px; border: 2px solid #9A6414; background: #F4EAD2; color: #6B430E; font-size: 17px; font-weight: 700; cursor: pointer">⚑ Flag for lead instead</button>
</sc-if>
<button type="button" onClick="{{cancelFix}}" style="flex: 0 1 140px; min-height: 52px; border-radius: 4px; border: 1px solid #A69E8F; background: #FFFDF8; color: #1C1B19; font-size: 17px; cursor: pointer">Cancel</button>
</div>
</sc-if>

<sc-if value="{{r.isTypeMode}}" hint-placeholder-val="{{ false }}">
<div style="border: 3px solid #45423C; background: #F4F0E8; border-radius: 6px; padding: 28px 28px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 30px; font-weight: 700">Type the serial twice</span>
<span style="font-size: 18px; color: #45423C">Read it off the label or the part. The app checks both entries match, then checks it against the PO.</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 2px">
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px"><label for="qr-type-1" style="font-size: 15px; font-weight: 600; color: #45423C">Serial</label><input id="qr-type-1" value="{{typed1}}" onChange="{{onTyped1}}" autoComplete="off" placeholder="e.g. SN-0413" style="{{typeStyle1}}"></div>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px"><label for="qr-type-2" style="font-size: 15px; font-weight: 600; color: #45423C">Type it again</label><input id="qr-type-2" value="{{typed2}}" onChange="{{onTyped2}}" autoComplete="off" style="{{typeStyle2}}"></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" onClick="{{saveTyped}}" style="flex: 1 1 200px; min-height: 52px; border-radius: 4px; border: 2px solid #7A5A2B; background: #7A5A2B; color: #FFFDF8; font-size: 17px; font-weight: 700; cursor: pointer">Save and check</button>
<button type="button" onClick="{{cancelType}}" style="flex: 0 1 140px; min-height: 52px; border-radius: 4px; border: 1px solid #A69E8F; background: #FFFDF8; color: #1C1B19; font-size: 17px; cursor: pointer">Back</button>
</div>
</sc-if>

<sc-if value="{{r.isManual}}" hint-placeholder-val="{{ false }}">
<div style="border: 3px solid #45423C; background: #F4F0E8; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 30px; font-weight: 700">Label won't scan</span>
<span style="font-size: 18px; color: #45423C">Type the serial twice. The app checks both entries match, then re-checks it against the PO.</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px"><label for="qr-serial-1" style="font-size: 15px; font-weight: 600; color: #45423C">Serial</label><input id="qr-serial-1" value="{{typed1}}" readonly style="{{typeStyle1}}"></div>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px"><label for="qr-serial-2" style="font-size: 15px; font-weight: 600; color: #45423C">Type it again</label><input id="qr-serial-2" value="{{typed2}}" readonly style="{{typeStyle2}}"></div>
</div>
<span style="{{matchNoteStyle}}">{{matchNote}}</span>
<button type="button" onClick="{{next}}" style="min-height: 56px; border-radius: 4px; border: 2px solid #7A5A2B; background: #EFE4CF; color: #5C4320; font-size: 18px; font-weight: 700; cursor: pointer">Save and check</button>
</sc-if>

<sc-if value="{{r.isFlag}}" hint-placeholder-val="{{ false }}">
<div role="status" style="border: 3px solid #9A6414; background: #F4EAD2; border-radius: 6px; padding: 36px 36px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 34px; font-weight: 700; color: #6B430E">⚑ Flagged for lead</span>
<span style="font-size: 20px; color: #6B430E">{{r.sub}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px">
<span style="{{r.chipNotOnPo}}">Not on this PO</span>
<span style="{{r.chipLabel}}">Label doesn't match part</span>
<span style="{{r.chipDamaged}}">Damaged</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600">{{r.value}}</span>
<span style="font-size: 16px; color: #5E5A52">{{r.detail}}</span>
</div>
<sc-if value="{{r.photo}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px; border: 1px solid #D8D1C4; border-radius: 4px">
<div aria-hidden="true" style="width: 96px; height: 64px; border-radius: 6px; background: #DCD5C8; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #45423C">Photo</div>
<span style="font-size: 16px">Photo attached: the label and the serial marked on the sensor, for QA</span>
</div>
</sc-if>
<span style="font-size: 17px; font-weight: 700; color: #234F2F">✓ Sent to the receiving lead</span>
<span style="font-size: 17px; font-weight: 600">Part on hold · the rest of the delivery continues</span>
<sc-if value="{{r.canUndo}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{undo}}" style="align-self: flex-start; min-height: 32px; padding: 2px 0; border: none; background: none; color: #7A5A2B; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">↶ {{r.undoText}}</button></sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-top: 9px; padding-top: 14px; border-top: 1px solid #E7E1D6"><button type="button" onClick="{{scanNext}}" style="min-height: 32px; padding: 2px 0; border: none; background: none; color: #7A5A2B; font-size: 16px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Scan next →</button><span style="font-size: 15px; color: #5E5A52">{{idleHint}}</span></div>
</sc-if>

<sc-if value="{{r.isQty}}" hint-placeholder-val="{{ false }}">
<div style="border: 3px solid #45423C; background: #F4F0E8; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 30px; font-weight: 700">Count the seal rings</span>
<span style="font-size: 18px; color: #45423C">Lot LOT-5520 · the PO expects 6</span>
</div>
<div style="display: flex; align-items: baseline; gap: 12px"><span style="font-size: 56px; font-weight: 700">5</span><span style="font-size: 22px; color: #5E5A52">of 6 counted</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 10px 16px; border-radius: 999px; border: 2px solid #9A6414; background: #F4EAD2; color: #6B430E; font-size: 16px; font-weight: 700">Short shipped</span>
<span style="padding: 10px 16px; border-radius: 999px; border: 1px solid #A69E8F; font-size: 16px; color: #45423C">Over</span>
<span style="padding: 10px 16px; border-radius: 999px; border: 1px solid #A69E8F; font-size: 16px; color: #45423C">Damaged</span>
</div>
<button type="button" onClick="{{next}}" style="min-height: 56px; border-radius: 4px; border: 2px solid #7A5A2B; background: #EFE4CF; color: #5C4320; font-size: 18px; font-weight: 700; cursor: pointer">Record 5 of 6 as short</button>
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-top: 9px; padding-top: 14px; border-top: 1px solid #E7E1D6"><button type="button" onClick="{{scanNext}}" style="min-height: 32px; padding: 2px 0; border: none; background: none; color: #7A5A2B; font-size: 16px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Scan next →</button><span style="font-size: 15px; color: #5E5A52">{{idleHint}}</span></div>
</sc-if>

<sc-if value="{{r.isResume}}" hint-placeholder-val="{{ false }}">
<div style="border: 3px solid #7A5A2B; background: #F6EFE2; border-radius: 6px; padding: 32px 24px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 32px; font-weight: 700; color: #5C4320">Welcome back</span>
<span style="font-size: 19px; color: #5C4320">Nothing was lost. You were on PO 4500-1234 with 3 of 5 lines done. Last scan: LOT-7781 at 10:42.</span>
<button type="button" onClick="{{next}}" style="align-self: flex-start; min-height: 56px; padding: 0 28px; border-radius: 4px; border: 2px solid #7A5A2B; background: #7A5A2B; color: #FFFDF8; font-size: 18px; font-weight: 700; cursor: pointer">Resume at line 4</button>
</div>
</sc-if>

<sc-if value="{{allDone}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{next}}" style="min-height: 60px; border-radius: 4px; border: 2px solid #7A5A2B; background: #7A5A2B; color: #FFFDF8; font-size: 19px; font-weight: 700; cursor: pointer">All lines handled · attach COCs</button>
</sc-if>
<sc-if value="{{linesView}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{backToReview}}" style="min-height: 60px; border-radius: 4px; border: 2px solid #7A5A2B; background: #7A5A2B; color: #FFFDF8; font-size: 19px; font-weight: 700; cursor: pointer">Back to review</button>
</sc-if>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{isCoc}}" hint-placeholder-val="{{ false }}">
<section style="padding: 36px 36px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<button type="button" onClick="{{showDeliveries}}" style="align-self: flex-start; margin-bottom: 12px; min-height: 32px; padding: 2px 0; border: none; background: none; color: #7A5A2B; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">← All deliveries</button>
<h1 style="margin: 0; font-size: 30px; font-weight: 700">Attach COCs · 2 needed</h1>
<p style="margin: 0; font-size: 17px; color: #5E5A52">AI reads each COC and suggests which lines it covers. A person confirms anything it isn't sure about.</p>
<p style="margin: 0; font-size: 15px; color: #5E5A52">Lines 1 and 4 need a COC.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px">
<div style="border: 2px solid #2F6B3F; border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600; color: #5E5A52; text-transform: uppercase; letter-spacing: 0.6px">Supplier email · PDF</span>
<span style="font-size: 20px; font-weight: 700">COC for actuator brackets</span>
<sc-if value="{{cocReading}}" hint-placeholder-val="{{ false }}"><span style="font-size: 20px; font-weight: 700; color: #5C4320; animation: qrpulse 0.9s ease-in-out infinite">Reading COC…</span></sc-if>
<sc-if value="{{cocRead}}" hint-placeholder-val="{{ true }}">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px">Part 12-3456 · Qty 4 · SN-0451 to SN-0454</span>
<span style="font-size: 16px">Matches line 1 · high confidence</span>
<span style="font-size: 18px; font-weight: 700; color: #234F2F">✓ Attached automatically</span>
</sc-if>
</div>
<div style="{{cocBStyle}}">
<span style="font-size: 14px; font-weight: 600; color: #5E5A52; text-transform: uppercase; letter-spacing: 0.6px">Paper COC · uploaded</span>
<span style="font-size: 20px; font-weight: 700">COC for seal rings</span>
<sc-if value="{{cocReading}}" hint-placeholder-val="{{ false }}"><span style="font-size: 20px; font-weight: 700; color: #5C4320; animation: qrpulse 0.9s ease-in-out infinite">Reading COC…</span></sc-if>
<sc-if value="{{cocRead}}" hint-placeholder-val="{{ true }}">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px">Part 44-2200 · Lot LOT-5520 · Qty 6</span>
<span style="font-size: 16px">Suggested: line 4 · needs a check</span>
<span style="font-size: 16px; font-weight: 600; color: #6B430E">The COC lists 6, but you received 5 (1 short).</span>
<sc-if value="{{cocPending}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{next}}" style="min-height: 52px; border-radius: 4px; border: 2px solid #7A5A2B; background: #EFE4CF; color: #5C4320; font-size: 17px; font-weight: 700; cursor: pointer">Confirm it's line 4</button>
</sc-if>
<sc-if value="{{cocDone}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 18px; font-weight: 700; color: #234F2F">✓ Attached · confirmed by J. Rivera</span>
</sc-if>
</sc-if>
</div>
</div>
<sc-if value="{{cocDone}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{next}}" style="align-self: flex-start; min-height: 60px; padding: 0 28px; border-radius: 4px; border: 2px solid #7A5A2B; background: #7A5A2B; color: #FFFDF8; font-size: 19px; font-weight: 700; cursor: pointer">Go to review</button>
</sc-if>
</section>
</sc-if>

<sc-if value="{{isReview}}" hint-placeholder-val="{{ false }}">
<section style="padding: 36px 36px; display: flex; flex-direction: column; gap: 18px; max-width: 720px">
<div style="display: flex; gap: 24px; margin-bottom: 12px">
<button type="button" onClick="{{showDeliveries}}" style="min-height: 32px; padding: 2px 0; border: none; background: none; color: #7A5A2B; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">← All deliveries</button>
<button type="button" onClick="{{showLines}}" style="min-height: 32px; padding: 2px 0; border: none; background: none; color: #7A5A2B; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">← Back to lines</button>
</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700">Ready to confirm · PO 4500-1234</h1>

<div style="display: flex; justify-content: space-between; gap: 12px; padding: 16px 20px; font-size: 19px; border-bottom: 1px solid #E7E1D6"><span>Received</span><span style="font-weight: 700">22 of 23 items</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 16px 20px; font-size: 19px; border-bottom: 1px solid #E7E1D6"><span>Short</span><span style="font-weight: 700">1 · seal ring</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 20px; border-bottom: 1px solid #E7E1D6"><div style="display: flex; justify-content: space-between; gap: 12px; font-size: 19px"><span>Flagged for lead</span><span style="font-weight: 700">{{flagCountText}}</span></div><sc-for list="{{reviewFlags}}" as="f" hint-placeholder-count="2"><span style="font-size: 15px; color: #5E5A52">{{f.text}}</span></sc-for></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 16px 20px; font-size: 19px"><span>COCs attached</span><span style="font-weight: 700">2 of 2</span></div>
</div>
<button type="button" onClick="{{next}}" style="min-height: 60px; border-radius: 4px; border: 2px solid #7A5A2B; background: #7A5A2B; color: #FFFDF8; font-size: 19px; font-weight: 700; cursor: pointer">Confirm receipt</button>
<span style="font-size: 16px; color: #5E5A52; text-align: center">or scan the CONFIRM barcode</span>

<span style="font-size: 44px; font-weight: 700; color: #234F2F">✓ Posted to ERP</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600">Receipt RCV-88213</span>

<button type="button" onClick="{{showPostedList}}" style="margin-top: 12px; min-height: 56px; padding: 0 28px; border-radius: 4px; border: 2px solid #7A5A2B; background: #FFFDF8; color: #5C4320; font-size: 18px; font-weight: 700; cursor: pointer">Back to deliveries</button>
</section>
</sc-if>
</main>

</sc-for>

</aside>
